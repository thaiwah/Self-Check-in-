<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Anuphan',sans-serif;background:#FBE3B9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:#1F2A6B}
button{font-family:inherit;cursor:pointer}

.card{position:relative;width:100%;max-width:440px;min-height:760px;background:#FFF8EA;border-radius:36px;box-shadow:0 24px 60px rgba(31,42,107,.22);overflow:hidden;padding:28px 24px;display:flex;flex-direction:column}
.blob{position:absolute;border-radius:50%}
.lang{position:absolute;top:14px;right:14px;z-index:5;display:flex;background:#fff;border:2px solid #1F2A6B;border-radius:999px;padding:2px}
.lang button{min-width:44px;height:34px;border:0;border-radius:999px;font-weight:700;font-size:13px;background:transparent;color:#1F2A6B}
.lang button[aria-pressed=true]{background:#1F2A6B;color:#fff}
.scr{position:relative;flex:1;display:flex;flex-direction:column;animation:rise .55s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 4s ease-in-out infinite}
.center{align-items:center;text-align:center}
.disp{font-family:'Fredoka','Anuphan',sans-serif;font-weight:700;margin:0}
.pill{background:#E4EAF6;font-weight:700;font-size:13px;padding:8px 16px;border-radius:999px;align-self:flex-start}
.primary{height:54px;border:0;border-radius:999px;background:#1F2A6B;color:#fff;font-weight:700;font-size:16px}
.ghost{height:54px;border:2px solid #1F2A6B;border-radius:999px;background:transparent;color:#1F2A6B;font-weight:700;font-size:16px;padding:0 22px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{transition:transform .25s ease,box-shadow .25s ease;display:flex;align-items:center;color:#1F2A6B}
.opt:hover{transform:translateY(-2px)}
.m{flex-direction:column;gap:2px;text-align:center;padding:16px 8px;border-radius:24px}
.r{gap:14px;padding:10px 14px;border-radius:20px;text-align:left;width:100%;font-size:16px;font-weight:600}
.ic{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.dots i{height:12px;border-radius:999px;transition:all .4s ease}
@media (prefers-reduced-motion:reduce){.scr,.bob{animation:none}.opt,.dots i{transition:none}}
</style>

        '<h2 class="disp" style="margin:26px 0 0;font-size:28px;line-height:1.25">' + esc(hd[0]) + '</h2>' +
        '<p style="margin:6px 0 18px;color:#3A4378;font-size:14px">' + esc(hd[1]) + '</p>' + body +
        '<div style="margin-top:auto;padding-top:22px"><div role="status" style="min-height:20px;text-align:center;font-size:13px;font-weight:600;color:#3A4378;margin-bottom:6px">' + (cur ? '' : esc(T.pick)) + '</div>' +
        '<div class="dots">' + [1, 2, 3].map(function (i) { return '<i style="width:' + (i === s ? 28 : 12) + 'px;background:' + (i === s ? '#1F2A6B' : '#D5CFE6') + '"></i>'; }).join('') + '</div>' +
        '<div style="display:flex;gap:10px"><button class="ghost" data-act="back">' + esc(T.back) + '</button><button class="primary" data-act="next" style="flex:1"' + (cur ? '' : ' disabled') + '>' + esc(s === 3 ? T.see : T.next) + '</button></div></div></div>';
    } else {
      var r = result();
      h = '<div class="scr center"><div class="pill">' + esc(T.pill) + '</div>' +
        '<h2 class="disp" style="margin:16px 0 0;font-size:34px;line-height:1.15;white-space:pre-line">' + esc(T.noteTitle) + '</h2>' +
        '<p style="margin:8px 0 0;font-size:14px;color:#3A4378">' + esc(T.thanks) + '</p>' +
        '<div style="margin-top:12px;background:#FFC4D6;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;transform:rotate(-3deg)">' + esc(r.sticker) + '</div>' +
        '<div style="margin-top:16px;width:100%;background:#fff;border-radius:10px;padding:22px 20px;transform:rotate(-1.5deg);box-shadow:0 10px 24px rgba(31,42,107,.15);font-size:16px;line-height:1.85"><div style="font-weight:600">' + esc(r.main) + '</div><div style="margin-top:12px;font-size:14.5px;color:#3A4378">' + esc(r.extra) + '</div></div>' +
        '<div style="margin-top:18px;background:#FFC4D6;border-radius:22px;padding:14px 18px;width:100%"><div class="disp" style="font-size:18px;letter-spacing:.03em">YOU ARE DOING JUST FINE.</div><div style="font-size:14px;margin-top:2px">' + esc(T.closing) + '</div></div>' +
        '<div style="margin-top:auto;padding-top:20px;width:100%;display:flex;flex-direction:column;gap:10px"><button class="primary" data-act="save">' + esc(S.saved ? T.saved : T.save) + '</button><button class="ghost" data-act="again">' + esc(T.again) + '</button><button class="ghost" data-act="home">' + esc(T.home) + '</button></div></div>';
    }
    view.innerHTML = h;
  }

  function savePng() {
    var en = S.lang === 'en', T = UI[S.lang], r = result();
    var go = function () {
      var c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
      var x = c.getContext('2d');
      x.fillStyle = '#FBE3B9'; x.fillRect(0, 0, 1080, 1350);
      x.fillStyle = '#FFD66B'; x.beginPath(); x.arc(1020, 40, 200, 0, 7); x.fill();
      x.fillStyle = '#1F2A6B'; x.beginPath(); x.arc(40, 20, 220, 0, 7); x.fill();
      x.fillStyle = '#BFE0FF'; x.beginPath(); x.arc(980, 1330, 260, 0, 7); x.fill();
      x.textAlign = 'center'; x.fillStyle = '#1F2A6B';
      x.font = '700 60px Fredoka, Anuphan, sans-serif'; x.fillText('GIVE YOURSELF A', 540, 300);
      x.font = '700 96px Fredoka, Anuphan, sans-serif'; x.fillText('LITTLE CHECK-IN', 540, 405);
      x.fillStyle = '#FFC4D6'; x.fillRect(290, 450, 500, 64);
      x.fillStyle = '#1F2A6B'; x.font = '700 30px Anuphan, sans-serif'; x.fillText(r.mood, 540, 493);
      x.fillStyle = '#fff'; x.fillRect(110, 560, 860, 560);
      x.fillStyle = '#1F2A6B'; x.textAlign = 'left';
      var y = 630;
      function wrap(t, size) {
        x.font = '600 ' + size + 'px Anuphan, sans-serif';
        var line = '', parts = en ? t.split(' ').map(function (w, i) { return (i ? ' ' : '') + w; }) : Array.from(t);
        parts.forEach(function (p) {
          if (x.measureText(line + p).width > 760) { x.fillText(line, 150, y); y += size * 1.7; line = p.trim() ? p.replace(/^\s+/, '') : ''; } else line += p;
        });
        x.fillText(line, 150, y); y += size * 1.7;
      }
      wrap(r.main, en ? 32 : 36); y += 14; wrap(r.extra, en ? 28 : 32);
      x.textAlign = 'center'; x.font = '700 44px Fredoka, sans-serif'; x.fillText('YOU ARE DOING JUST FINE.', 540, 1210);
      x.font = '500 28px Anuphan, sans-serif'; x.fillText(T.closing, 540, 1262);
      c.toBlob(function (b) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = 'my-little-check-in-' + S.lang + '.png'; document.body.appendChild(a); a.click(); a.remove();
      });
      S.saved = true; render();
    };
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('600 36px Anuphan'), document.fonts.load('700 60px Fredoka')]).then(go, go);
    } else go();
  }

  document.getElementById('card').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.lang) { S.lang = b.dataset.lang; S.saved = false; return render(); }
    if (b.dataset.pick) { S.a[S.step - 1] = b.dataset.pick; return render(); }
    var act = b.dataset.act;
    if (act === 'start') S.step = 1;
    else if (act === 'back') S.step -= 1;
    else if (act === 'next') { if (!S.a[S.step - 1]) return; S.step += 1; }
    else if (act === 'again') { S.a = [null, null, null]; S.step = 1; S.saved = false; }
    else if (act === 'home') { S.a = [null, null, null]; S.step = 0; S.saved = false; }
    else if (act === 'save') return savePng();
    render();
  });
  render();
})();
</script>
</body>
</html>
